# How we fetch from each source — the rules the code enforces (src/pm25/ingestion/polite.py).
#
# Principles (docs/data_ethics.md):
#   1. Bulk archive first, API second, never scraping web pages.
#   2. Stay well under every published limit (we target <= 80% of it).
#   3. Identify ourselves (User-Agent with a real contact e-mail).
#   4. Back off when the server asks (429/503 + Retry-After) and stop when it keeps failing.
#   5. Never download the same thing twice (resumable, skip-existing).
#   6. Take only what an analytical question needs; keep attribution and licence with the data.
#
# budgets: list of {limit, window_s}. Every request consumes `weight` (default 1).
# robots: "obey"      -> refuse URLs disallowed by robots.txt
#         "api_terms" -> host is a documented public API whose terms govern programmatic use;
#                        robots.txt is still read and its verdict logged in the ledger.

contact_required: true          # refuse to run without an e-mail in HTTP_USER_AGENT

hosts:
  pm25.gistda.or.th:
    name: GISTDA PM2.5 (ระบบเช็คฝุ่น)
    rate_per_sec: 2.0
    max_concurrency: 4
    budgets:
      - {limit: 400, window_s: 3600}       # no published limit -> self-imposed. Normal use: hourly 78 +
                                           # daily safety net 78 in one hour; headroom for retries/manual runs
    robots: obey
    licence: "Not specified on the GISTDA Open Data catalog (checked 2026-10-02)"
    attribution: "PM2.5 estimates: GISTDA, ระบบเช็คฝุ่น (https://pm25.gistda.or.th)"
    terms_url: https://opendata.gistda.or.th/en/dataset/pm2-5
    notes: "Licence unclear -> educational use, attribution, no redistribution of raw files; ask InnoTech@gistda.or.th"

  firms.modaps.eosdis.nasa.gov:
    name: NASA FIRMS
    rate_per_sec: 1.0
    max_concurrency: 1
    budgets:
      - {limit: 4000, window_s: 600}       # published: 5,000 transactions / 10 min per MAP_KEY
    weight: day_range                      # a multi-day request counts as several transactions
    robots: obey
    licence: "NASA open data policy"
    attribution: "Active fire data: NASA FIRMS (https://firms.modaps.eosdis.nasa.gov), LANCE/ESDIS — VERIFY exact acknowledgement wording on the FIRMS site"
    terms_url: https://firms.modaps.eosdis.nasa.gov/api/area/

  api.openaq.org:
    name: OpenAQ API v3
    rate_per_sec: 0.5
    max_concurrency: 1
    budgets:
      - {limit: 48, window_s: 60}          # published free tier: 60 / minute
      - {limit: 1600, window_s: 3600}      # published free tier: 2,000 / hour
    robots: api_terms
    robots_reason: "Documented API that requires a registered key; OpenAQ terms govern use"
    licence: "Varies by provider (CC licences, open government licences, bespoke terms)"
    attribution: "Air quality data: OpenAQ (https://openaq.org) and the original provider (e.g. Air4Thai / Pollution Control Department)"
    terms_url: https://docs.openaq.org/about/terms

  openaq-data-archive.s3.amazonaws.com:
    name: OpenAQ archive on AWS Open Data
    rate_per_sec: 120.0                    # AWS Open Data bucket meant for bulk download. S3 serves >= 5,500
    max_concurrency: 48                    # GETs/s PER PREFIX and every station is its own prefix, so 120/s in
                                           # total is ~2% of one prefix's capacity. Files are ~0.3 KB, so this is
                                           # ~40 KB/s of bandwidth. Throttling (503 SlowDown) makes the client
                                           # back off automatically (botocore adaptive retry mode).
    budgets: []
    robots: api_terms
    robots_reason: "Official bulk-download channel documented by OpenAQ (Registry of Open Data on AWS)"
    licence: "Varies by provider"
    attribution: "Air quality data: OpenAQ (https://openaq.org) and the original provider"
    terms_url: https://docs.openaq.org/aws/about

  archive-api.open-meteo.com:
    name: Open-Meteo Historical Weather API (ERA5)
    rate_per_sec: 1.0
    max_concurrency: 1
    # Observed 2026-10-02 (request ledger): at 60 one-year requests/minute the API answered 429 after
    # ~39 successes per minute, far below the published 600/min — i.e. a long-range request is counted
    # as many calls. We weight 1 call per 24 days requested (a year = 16 calls). VERIFY on the docs.
    weight: "per_days:24"
    budgets:
      - {limit: 480, window_s: 60}         # published free tier: 600 / minute
      - {limit: 4000, window_s: 3600}      # published free tier: 5,000 / hour
      - {limit: 8000, window_s: 86400}     # published free tier: < 10,000 / day
    robots: api_terms
    robots_reason: >-
      robots.txt on this API host disallows automated agents (checked 2026-10-02), while the
      Open-Meteo terms explicitly offer the API for free non-commercial and research use within
      the limits above. We follow the API terms, stay below 80% of each limit and record the
      robots verdict in the ledger. Strict alternative: ERA5 from the Copernicus Climate Data Store.
    licence: "CC BY 4.0"
    attribution: "Weather data by Open-Meteo.com (CC BY 4.0), based on ERA5 reanalysis (Copernicus Climate Change Service)"
    terms_url: https://open-meteo.com/en/terms

  air4thai.pcd.go.th:
    name: Air4Thai (Pollution Control Department)
    rate_per_sec: 0.0                      # 0 = do not fetch from this host at all
    max_concurrency: 0
    budgets: []
    robots: obey
    licence: "n/a"
    attribution: "Use Air4Thai data via OpenAQ instead"
    notes: "robots.txt disallows automated access and there is no documented API -> not used"
