[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pm25"
version = "0.1.0"
description = "PM2.5 Thailand data pipeline (university Big Data project)"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Week-1 scripts load .env before importing the package on purpose
"scripts/week1/*.py" = ["E402"]
"scripts/backfill/*.py" = ["E402"]
